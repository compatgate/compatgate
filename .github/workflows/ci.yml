name: CI

on:
  pull_request:
    # `labeled`: the label `release-check` runs the build of every platform on any pull request.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Repository (data, format, lint, tests, types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm install --frozen-lockfile
      # The dependencies that the packages bring to a project: a known flaw there fails CI. The dev tools are not in it.
      - run: pnpm audit --prod
      - run: pnpm run check

  node:
    name: Packages on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      # One version must not cancel the other: each shows its own failure.
      fail-fast: false
      matrix:
        # The lowest version of `engines` and the newest line; Node 24 runs the tests of the repository above.
        node: ['22.12', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about@0.9.2
          fallback: none
      - run: pnpm install --frozen-lockfile
      # The tests are TypeScript that Node 24 runs as it is: the packages are checked on other versions through
      # their tarballs, as a user installs them.
      - run: pnpm --filter @compatgate/core run build:debug && pnpm -r run build:js && pnpm third-party
      # `napi artifacts` wants the binaries of every target: the one binary of this job is copied by hand.
      - working-directory: packages/core
        run: pnpm exec napi create-npm-dirs && cp compatgate.linux-x64-gnu.node npm/linux-x64-gnu/
      - run: node scripts/prepare-platform-packages.js
      - run: |
          mkdir -p .smoke
          (cd packages/core/npm/linux-x64-gnu && npm pack --pack-destination ../../../../.smoke)
          for name in core eslint bundler; do (cd packages/$name && pnpm pack --pack-destination ../../.smoke); done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '${{ matrix.node }}'
      - run: node scripts/smoke.js --tarballs .smoke

  eslint-9:
    name: Rules on ESLint 9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm install --frozen-lockfile
      # The newest ESLint 9 on purpose, outside the lockfile: the job has no secrets, and its token only reads.
      - run: pnpm --filter @compatgate/eslint add -D eslint@^9 # zizmor: ignore[adhoc-packages]
      - run: pnpm run build:debug
      - run: pnpm --filter @compatgate/eslint test

  package:
    name: Package contents (files, publint, attw)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about@0.9.2
          fallback: none
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:debug
      - run: pnpm third-party
      - run: node scripts/pack-check.js
      - run: |
          for name in core eslint bundler; do
            npx --yes publint@0.3.25 packages/$name --strict
            npx --yes @arethetypeswrong/cli@0.18.5 --pack packages/$name --profile esm-only
          done

  deny:
    name: Crates (licenses, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  zizmor:
    name: Workflows (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: zizmor@1.30.1
          fallback: none
      # The token lets zizmor check online that each pinned commit belongs to its action and has no known flaw.
      - run: zizmor --min-severity=low .github
        env:
          GH_TOKEN: ${{ github.token }}

  dependency-review:
    name: New dependencies (advisories, licenses)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # The licenses of deny.toml and the other permissive ones: the packages bring their npm dependencies to a
          # project. caniuse-lite is data under CC-BY-4.0, as browserslist needs it.
          allow-licenses: >-
            MIT, Apache-2.0, Apache-2.0 WITH LLVM-exception, Unicode-3.0, ISC, Unlicense, BSD-2-Clause, BSD-3-Clause,
            0BSD
          allow-dependencies-licenses: pkg:npm/caniuse-lite

  changes:
    name: Changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            build:
              - 'crates/**'
              - 'packages/core/src/**'
              - 'packages/core/Cargo.toml'
              - 'packages/core/build.rs'
              - 'packages/core/package.json'
              - 'Cargo.*'
              - '.cargo/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/**'
              - 'scripts/smoke*'
              - 'scripts/smoke/**'
              - 'scripts/local-registry.js'
              - 'scripts/verdaccio.yaml'
              - 'scripts/prepare-platform-packages.js'

  build:
    name: Binaries
    needs: changes
    if: needs.changes.outputs.build == 'true' || contains(github.event.pull_request.labels.*.name, 'release-check')
    # `$/` of GitHub fails actionlint 1.7.12.
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]
