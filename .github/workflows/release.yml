name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# One release at a time, and none is cut off halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Versions and the release PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # create-pull-request pushes the branch of the PR and opens it.
      contents: write
      pull-requests: write
    outputs:
      unpublished: ${{ steps.state.outputs.unpublished }}
      version: ${{ steps.state.outputs.version }}
      tag: ${{ steps.state.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: state
        run: node scripts/unpublished.js >> "$GITHUB_OUTPUT"
      # Pending intents become new versions and changelogs in the PR "chore: version packages"; without them
      # `pnpm version -r` changes nothing and the PR is not opened.
      - id: bump
        run: |
          pnpm version -r
          if git diff --quiet; then echo changed=false; else echo changed=true; fi >> "$GITHUB_OUTPUT"
      # napi writes the version into the committed binding.js: a new version needs a new loader in the PR. The build
      # of every target checks that the loader matches.
      - if: steps.bump.outputs.changed == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: steps.bump.outputs.changed == 'true'
        run: pnpm --filter @compatgate/core run build:native:debug
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: release/version-packages
          title: 'chore: version packages'
          commit-message: 'chore: version packages'
          body: The versions and changelogs of the pending change intents. Merging it publishes them.
          # A PR of GITHUB_TOKEN starts no workflow. A draft waits for the owner: "Ready for review" starts CI, and
          # an update of the PR makes it a draft again. No token of an App or a person lives in the secrets.
          draft: always-true
          # The ruleset of `main` takes only signed commits: GitHub signs the commits of github-actions[bot].
          sign-commits: true

  build:
    name: Binaries
    needs: version
    if: needs.version.outputs.unpublished == 'true'
    # `$/` of GitHub fails actionlint 1.7.12.
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]

  publish:
    name: Publish to npm
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The environment holds the npm token and waits for the approval of the owner.
    environment: npm
    permissions:
      # `gh release create` tags the release.
      contents: write
      # The provenance of the packages.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-about@0.9.2
          fallback: none
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bindings-*
          path: packages/core/artifacts
      - working-directory: packages/core
        run: pnpm exec napi create-npm-dirs && pnpm exec napi artifacts --output-dir artifacts --npm-dir npm
      - run: pnpm -r run build:js && pnpm third-party && node scripts/prepare-platform-packages.js
      # The platform packages first: the core lists them in its optionalDependencies. napi skips a version that npm
      # already has, so a rerun publishes only the rest.
      - working-directory: packages/core
        run: pnpm exec napi pre-publish -t npm --no-gh-release
        env:
          # The npm tag of the release: napi runs a bare `npm publish`, which reads it from here. npm refuses a
          # prerelease without a tag.
          NPM_CONFIG_TAG: ${{ needs.version.outputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      # npm serves a new version only after its scan of the tarball, minutes after the publish: an install of the core
      # before then finds no platform package.
      - run: node scripts/wait-for-npm.js packages/core/npm/*
      # `prepublishOnly` of the core runs napi with `--skip-optional-publish`: the platform packages are on npm.
      # `pnpm publish -r` skips a version that npm already has.
      - run: pnpm publish -r --provenance --report-summary --no-git-checks --tag "$NPM_CONFIG_TAG"
        env:
          NPM_CONFIG_TAG: ${{ needs.version.outputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      # The release and the check of the install start when an install can find the packages.
      - run: node scripts/wait-for-npm.js packages/core packages/eslint packages/bundler
      # One release for the three packages, which share the version. `--target` tags the commit of the release: no
      # separate push of tags.
      - name: Tag the release and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          NEXT: ${{ needs.version.outputs.tag == 'next' }}
        run: |
          if [ "$NEXT" = true ]; then set -- --prerelease; fi
          node scripts/release-notes.js "$VERSION" > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md "$@"

  smoke:
    name: Installed from npm on ${{ matrix.host }}
    needs: [version, publish]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # bash on every system: on Windows the default PowerShell reads `$VERSION` as a variable of its own.
      - shell: bash
        run: node scripts/smoke.js --version "$VERSION"
        env:
          VERSION: ${{ needs.version.outputs.version }}
