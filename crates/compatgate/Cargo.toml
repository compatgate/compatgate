[package]
name = "compatgate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
browserslist-rs.workspace = true
globset.workspace = true
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_parser.workspace = true
oxc_regular_expression.workspace = true
oxc_semantic.workspace = true
oxc_span.workspace = true

[dev-dependencies]
# The integration tests read the step counters, which only this feature builds into the library.
compatgate = { path = ".", features = ["counters"] }
# The corpus reads the `allow` entries of a file as JSON.
serde_json.workspace = true

[features]
# Step counters for the linearity tests: `compatgate::counters`. Off in every build that ships.
counters = []

[lints]
workspace = true
