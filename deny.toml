[graph]
targets = [
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "wasm32-wasip1",
]

[licenses]
# Permissive licenses only: the binary is distributed under MIT OR Apache-2.0.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "ISC", "Unlicense"]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[advisories]
yanked = "deny"
