packages:
  - packages/*
  - conformance

catalog:
  '@napi-rs/cli': ^3.10.8
  '@rspack/core': ^2.2.8
  '@swc/core': ^1.16.13
  '@types/node': ^24
  '@vitejs/plugin-vue': ^6.0.9
  esbuild: ^0.28.2
  eslint: ^10.12.0
  oxlint: ^1.87.0
  rolldown: ^1.2.13
  rollup: ^4.64.2
  swc-loader: ^0.2.7
  typescript: 7.0.2
  unplugin: ^3.4.0
  vite: ^8.3.4
  vue: ^3.5.43
  webpack: ^5.111.1

allowBuilds:
  esbuild: true
  # The postinstall only checks the native binary; the platform package installs it.
  '@swc/core': false

# verdaccio 6.10.5, the local registry of the smoke check, takes versions with known flaws. A dev tool that listens
# on 127.0.0.1 in CI, but the alerts of the repository show them. braces has no fixed version yet.
overrides:
  handlebars: ^4.7.10
  compression: ^1.8.2

# The three packages release at one version. The private packages are never published.
versioning:
  fixed:
    - ['@compatgate/core', '@compatgate/eslint', '@compatgate/bundler']
  ignore:
    - conformance
    - '@compatgate/test-utils'
  # A major change waits in a branch of its own: an intent `major` in `main` fails `pnpm change check`.
  maxBump: minor
  # The changelogs live in the repository: the GitHub Releases take their text from them.
  changelog:
    storage: repository
