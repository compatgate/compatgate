# The local registry of scripts/local-registry.js. It is copied into a temporary directory: the paths are relative to it.
storage: ./storage
# A debug build of the binary packs to about 18 MB; verdaccio takes 10 MB by default.
max_body_size: 200mb
auth:
  htpasswd:
    file: ./htpasswd
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
packages:
  '@compatgate/*':
    access: $all
    publish: $authenticated
  '**':
    access: $all
    publish: $authenticated
    proxy: npmjs
log:
  type: stdout
  format: pretty
  level: warn
